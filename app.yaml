command:
  - python
  - app.py

env:
  - name: SPREADSHEET_ID
    value: "1tLNo0_xjtmWKM9Y7PcChFut8S0w0kMKeAvFi9zg52gA"
  - name: SHEET_NAME
    value: "Data"
  - name: HEADER_ROW
    value: "4"
  - name: ALLOW_SHEET_WRITE
    value: "false"

  - name: GEMINI_MODEL
    value: "gemini-2.5-flash"
  - name: VOICE_GEMINI_MODEL
    value: "gemini-2.5-flash"
  - name: GEMINI_API_KEY
    valueFrom: gemini_api_key

  - name: GOOGLE_SERVICE_ACCOUNT_JSON
    valueFrom: google_service_account_json

  - name: ESP32_API_TOKEN
    valueFrom: esp32_api_token
  - name: ALLOW_INSECURE_DEVICE_API
    value: "false"

  - name: OTA_VOLUME_PATH
    valueFrom: ota_firmware_volume
  - name: OTA_CHANNEL
    value: "stable"
