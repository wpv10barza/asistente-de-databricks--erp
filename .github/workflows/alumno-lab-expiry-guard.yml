name: Horometro 3C - student lab expiry guard

# A delayed GitHub schedule is a best-effort safety net, not an exact-time cutoff.
# Only controls the explicitly named student App in the explicitly named workspace.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alumno-3c-expiry-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: alumno-3c
    permissions:
      contents: read
      id-token: write
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      LAB_END_UTC: ${{ vars.LAB_END_UTC }}
    steps:
      - name: Validate lab deadline
        id: expiry
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$LAB_END_UTC" ]]; then
            echo "::notice::No lab deadline configured. No change to App."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "expired=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$LAB_END_UTC" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] ||
            { echo "::error::Invalid UTC LAB_END_UTC format"; exit 1; }
          test "$DATABRICKS_HOST" = "https://dbc-77f7771e-2520.cloud.databricks.com" ||
            { echo "::error::Wrong workspace. Refuse to touch App."; exit 1; }
          test -n "$DATABRICKS_CLIENT_ID" ||
            { echo "::error::OIDC service principal not configured"; exit 1; }
          now=$(date -u +%s)
          end=$(date -u -d "$LAB_END_UTC" +%s)
          echo "configured=true" >> "$GITHUB_OUTPUT"
          if (( now >= end )); then
            echo "expired=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Student lab expired; stop required"
          else
            echo "expired=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Student lab scheduled to end at $LAB_END_UTC"
          fi

      - name: Install Databricks CLI
        if: steps.expiry.outputs.configured == 'true'
        uses: databricks/setup-cli@main

      - name: Audit only student App compute status
        if: steps.expiry.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          databricks apps get asistente-cloud-erp-alumno --output json > student-app.json
          python - <<'PY'
          import json
          d=json.load(open("student-app.json", encoding="utf-8"))
          if d.get("name") != "asistente-cloud-erp-alumno":
              raise SystemExit("Wrong App name")
          print("Student App state:", d.get("compute_status", {}).get("state", "UNKNOWN"))
          PY

      - name: Stop only expired student App
        if: steps.expiry.outputs.expired == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APP=asistente-cloud-erp-alumno
          state=$(python -c 'import json; print(json.load(open("student-app.json")).get("compute_status",{}).get("state",""))')
          if [[ "$state" != "STOPPED" ]]; then
            databricks apps stop "$APP" --timeout 20m
          fi
          databricks apps get "$APP" --output json > after-stop.json
          python - <<'PY'
          import json
          d=json.load(open("after-stop.json", encoding="utf-8"))
          assert d.get("name") == "asistente-cloud-erp-alumno", "Wrong App"
          state=d.get("compute_status", {}).get("state", "")
          if state != "STOPPED":
              raise SystemExit("Stop not confirmed: " + state)
          print("Student App STOPPED: confirmed.")
          PY
          echo "### Student 3C lab: STOPPED after expiry" >> "$GITHUB_STEP_SUMMARY"
          echo "- App: $APP" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deadline UTC: $LAB_END_UTC" >> "$GITHUB_STEP_SUMMARY"
